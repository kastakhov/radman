# Test configuration for RadMan
spring.application.name=radman-test

# Radman Database (Internal) - H2 in-memory
database.radman.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
database.radman.datasource.url=jdbc:hsqldb:mem:radmandb;DB_CLOSE_DELAY=-1
database.radman.datasource.username=sa
database.radman.datasource.password=

database.radman.jpa.hibernate.ddl-auto=create-drop
database.radman.jpa.hibernate.dialect=org.hibernate.dialect.HSQLDialect
database.radman.jpa.show-sql=false

database.radman.liquibase.enabled=true
database.radman.liquibase.change-log=classpath:db/changelog/hsql/db.changelog-master.xml

# Radius Database - H2 in-memory
database.radius.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
database.radius.datasource.url=jdbc:hsqldb:mem:radiusdb;DB_CLOSE_DELAY=-1
database.radius.datasource.username=sa
database.radius.datasource.password=

database.radius.jpa.hibernate.ddl-auto=create-drop
database.radius.jpa.hibernate.dialect=org.hibernate.dialect.HSQLDialect
database.radius.jpa.show-sql=false

# Security
security.auto-login.enabled=false

# Logging
logging.level.software.netcore.radman=DEBUG
logging.level.org.springframework.test=INFO
